[package]
name = "handler"
version = "0.1.0"
edition = "2021"
# Appwrite Cloud currently exposes rust-1.83 as its only Rust Function runtime.
rust-version = "1.83"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "handler"
path = "main.rs"

[dependencies]
anyhow = "1.0"
chrono = "=0.4.39"
hex = "0.4"
# Appwrite's second Rust packaging pass resolves dependencies again. Keep its
# Rust 1.83 runtime off ICU 2.x even when that pass ignores Cargo.lock.
idna = "=1.0.3"
idna_adapter = "=1.1.0"
openruntimes = { version = "1.0.2", package = "openruntimes-types-for-rust" }
ureq = { version = "=2.12.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
url = "=2.5.4"
zeroize = "=1.8.1"
