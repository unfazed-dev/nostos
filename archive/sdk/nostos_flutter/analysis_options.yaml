# Reference-only archive — excluded from analysis. See archive/README.md.
# Governs the orphaned test/ and test_driver/ snapshots, which lost their
# enclosing package when the Flutter SDK's pubspec stayed at sdk/nostos_flutter/
# while these moved under archive/. The example/ package (which has its own
# pubspec, and therefore its own analysis_options.yaml at its package root) is
# covered here too as a belt-and-suspenders for any loose-file context.
analyzer:
  exclude:
    - "example/**"
    - "test/**"
    - "test_driver/**"
