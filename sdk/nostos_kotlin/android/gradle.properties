# AndroidX (required for androidx.test runner in connectedDebugAndroidTest).
android.useAndroidX=true

# Kotlin code style (kotlinter default; harmless if unused).
kotlin.code.style=official

# JVM args for the gradle daemon — bumped from default to handle AGP + Kotlin
# compiler memory pressure during the test-apk build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build cache + parallel (small project, marginal but free).
org.gradle.caching=true
org.gradle.parallel=true
