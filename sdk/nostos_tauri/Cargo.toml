[package]
# `tauri-plugin-<name>`: tauri-plugin's build script strips the prefix to get
# the ACL namespace, and Tauri resolves capabilities by the runtime plugin
# name (`Builder::new("cairn")`). Crate `nostos-tauri` produced namespace
# `nostos-tauri:*` → every `invoke("plugin:cairn|…")` failed "Plugin not found"
# (caught by fixture/tests/ipc.rs, 2026-09-21). The directory stays
# sdk/nostos_tauri.
name = "tauri-plugin-cairn"
# tauri-plugin 2.6+ requires `links` == package.name so its build script can
# associate the generated permission artifacts with this crate.
links = "tauri-plugin-cairn"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tauri 2 plugin exposing nostos-client's SyncClient<SqliteStorage> to desktop web apps (feasibility scaffold)."
license = "Apache-2.0"
repository = "https://github.com/unfazed-dev/nostos"
homepage = "https://github.com/unfazed-dev/nostos"  # NOSTOS-IDENTITY-PENDING

[lib]
crate-type = ["lib"]

# -----------------------------------------------------------------------------
# Standalone workspace (mirrors sdk/nostos_flutter/rust/Cargo.toml +
# sdk/nostos_node/Cargo.toml): detaches this crate from the root nostos
# Cargo.toml so the root `make ci` gate is not entangled with an experimental
# Tauri scaffold. The root workspace already forbids hand-written `unsafe`
# workspace-wide; this crate keeps `#![forbid(unsafe_code)]` — the forbid
# applies to THIS crate's source, not its dependencies', so tauri's internal
# FFI is unaffected.
# -----------------------------------------------------------------------------
[workspace]

[dependencies]
# Path deps — same shape as sdk/nostos_flutter/rust/Cargo.toml (this crate lives
# at sdk/nostos_tauri/, so the crates are three levels up). nostos-core is
# required transitively: PendingWrite / WriteOp live there, and nostos-client
# re-exports neither. nostos-domain is required for the Lsn accessor in
# checkpoint().
nostos-client = { path = "../../crates/nostos-client" }
nostos-core = { path = "../../crates/nostos-core" }
nostos-domain = { path = "../../crates/nostos-domain" }

tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "sync", "macros"] }
# Push-token REST round-trips (ADR-0037 §3): default-features off + rustls so
# no native TLS stack is pulled into the plugin — the same pin every sibling
# SDK (nostos_node/kotlin/dotnet/swift) uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
# `process` (spawning the spine binary), `io-util` (TCP read_to_end/write_all),
# `net` (TcpStream for the raw HTTP/1.1 /push), `time` (poll deadline) — the
# live-E2E test's harness needs these beyond the runtime features the lib uses.
tokio = { version = "1.39", features = ["rt-multi-thread", "sync", "macros", "test-util", "process", "io-util", "net", "time"] }

[profile.release]
# Smaller artifacts for the plugin .so/.dll; lto is off by default to keep the
# scaffolding link fast (this is a feasibility build, not a shipped binary).
lto = false
