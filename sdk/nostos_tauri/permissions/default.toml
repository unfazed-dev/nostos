"$schema" = "schemas/schema.json"

[default]
description = "Nostos Tauri plugin — default permissions for the connect/subscribe/write/query/checkpoint/watch/set-token/sign-out + push-token register/deregister surface. A shipped plugin would add scoped per-table permission sets; this scaffold grants all ten commands unconditionally."
permissions = [
    "allow-connect",
    "allow-subscribe",
    "allow-write",
    "allow-query",
    "allow-checkpoint",
    "allow-watch",
    "allow-set-token",
    "allow-sign-out",
    "allow-register-push-token",
    "allow-deregister-push-token",
    "allow-or-set-add",
    "allow-or-set-remove",
    "allow-counter-increment",
    "allow-counter-decrement",
    "allow-dead-letters",
    "allow-connection-state",
]
