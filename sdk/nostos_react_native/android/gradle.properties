# JVM args for the gradle daemon (AGP + Kotlin compiler memory pressure).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AndroidX (required for androidx.test runner in connectedDebugAndroidTest).
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official

# Build cache + parallel (small project, marginal but free).
org.gradle.caching=true
org.gradle.parallel=true
