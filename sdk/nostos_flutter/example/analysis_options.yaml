# Reference-only archive — excluded from analysis. See archive/README.md.
#
# Nothing in archive/ is built, tested, linted, or run. This example was moved
# out of sdk/nostos_flutter/ on 2026-07-30, severing its `nostos_flutter: ../`
# path dependency (the SDK's pubspec stayed at sdk/nostos_flutter/). Unresolved,
# that surfaces ~180 import / undefined-symbol errors in the IDE Problems panel.
# Excluding every source file keeps the code readable without re-wiring a dead
# package back into the live tree.
include: package:flutter_lints/flutter.yaml
analyzer:
  exclude:
    - "**"
    - build/**
    - ios/**
    - web/**
    - macos/**
