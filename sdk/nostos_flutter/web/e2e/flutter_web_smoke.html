<!doctype html>
<!--
  flutter_web_smoke.html — Playwright harness for the Flutter-web Worker (ADR-0036).

  This is the browser half of the Flutter-web smoke. It spawns the Flutter-web
  SharedWorker broker (`nostos/nostos_broker.js`) and drives WebNostosEngine's boundary protocol
  directly from JS — connect, watch, write — surfacing every push + response on
  `window.nostos*` for the Playwright spec to poll. The Dart WebNostosEngine layer
  (the pure-Dart protocol fanout) is covered by test/engine_web_test.dart; this
  page proves the JS Worker asset itself boots the shared wasm backend, connects
  to a live server, applies a write, and pushes the reactive snapshot back.

  Real browser only (FileSystemSyncAccessHandle / OPFS path; falls back to
  memory if sqlite-wasm isn't served — the Safari-Private-Browsing degrade).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nostos Flutter-web Worker smoke</title>
  </head>
  <body>
    <h1>Nostos Flutter-web Worker smoke (ADR-0036)</h1>
    <p id="status">spawning worker…</p>
    <script type="module">
      const log = (m) => console.log("[flutter-web-smoke] " + m);
      const worker = new SharedWorker("/nostos/nostos_broker.js", { type: "module" }).port;
      worker.start();

      const pending = new Map();
      let nextId = 1;
      window.nostosEvents = [];
      window.nostosSnapshots = [];
      window.nostosConnected = null;
      window.nostosStorage = null;
      window.nostosErrors = [];

      worker.onmessageerror = (e) => {
        window.nostosErrors.push("worker.onmessageerror: " + (e.message || e));
      };

      worker.onmessage = (ev) => {
        const d = ev.data || {};
        if (d.type === "retireEngine") {
          const retire = () => {
            window.nostosChildWorker?.terminate();
            window.nostosChildWorker = null;
          };
          if (window.nostosRetireDelayMs) setTimeout(retire, window.nostosRetireDelayMs);
          else retire();
          return;
        }
        if (d.type === "needEngine") {
          window.nostosChildWorker?.terminate();
          const child = new Worker("/nostos/nostos_worker.js", { type: "module" });
          const channel = new MessageChannel();
          child.postMessage({ cmd: "attachPort", port: channel.port1 }, [channel.port1]);
          worker.postMessage({ cmd: "attachEngine", port: channel.port2 }, [channel.port2]);
          window.nostosChildWorker = child;
          return;
        }
        // Unsolicited push (has `type`).
        if (d.type) {
          window.nostosEvents.push(d);
          if (d.type === "snapshot") {
            window.nostosSnapshots.push(d);
            log("snapshot " + d.table + " (" + (d.json || "").length + " bytes)");
          } else if (d.type === "status") {
            window.nostosConnected = !!d.connected;
            log("status connected=" + d.connected);
          } else if (d.type === "storage") {
            window.nostosStorage = d.mode;
            log("storage mode=" + d.mode + (d.error ? " err=" + d.error : ""));
          } else if (d.type === "writeStatus") {
            log("writeStatus pending=" + d.pending);
          }
          return;
        }
        // Request response (has `id`).
        const id = d.id;
        if (id != null && pending.has(id)) {
          pending.get(id)(d);
          pending.delete(id);
        }
      };

      function request(msg) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, (d) => (d.error ? reject(new Error(d.error)) : resolve(d)));
          worker.postMessage({ ...msg, id });
        });
      }

      window.nostosConnect = (url, table) =>
        request({
          cmd: "connect",
          url,
          token: null,
          tables: [{ name: table, whereSql: null }],
        });

      window.nostosConnectAppwrite = (url, token, userId = "user-a") =>
        request({ cmd: "connect", url, provider: "appwrite", projectId: "test-project",
          functionId: "test-function", userId, token,
          tables: [{ name: "tasks" }] });

      window.nostosClose = () => request({ cmd: "close" });
      window.nostosSignOut = () => request({ cmd: "signOut" });
      window.nostosSetToken = (token) => request({ cmd: "setToken", token });
      window.nostosDisconnect = () => request({ cmd: "disconnect" });
      window.nostosResume = () => request({ cmd: "resume" });
      window.nostosCrashEngine = () => {
        window.nostosChildWorker?.terminate();
        window.nostosChildWorker = null;
      };

      window.nostosWrite = (table, pk, payloadJson) =>
        request({ cmd: "write", table, op: "upsert", pk, payloadJson });

      window.nostosWatch = (table) =>
        worker.postMessage({ cmd: "watch", table });

      // Wave 4c (ADR-0036): CRDT + atomic-writeBatch driver surface. These
      // exercise the new NostosSocket delegates through the real Worker/wasm
      // path — proving the verbs ship over the live socket, not just enqueue.
      window.nostosSetCrdtTables = (orSet, counter) =>
        request({ cmd: "setCrdtTables", orSet, counter });

      window.nostosCounterIncrement = (table, pk, delta) =>
        request({ cmd: "counterIncrement", table, pk, delta });

      window.nostosOrSetAdd = (table, pk, element) =>
        request({ cmd: "orSetAdd", table, pk, element });

      window.nostosWriteBatch = (ops) =>
        request({ cmd: "writeBatch", ops });

      window.addEventListener("pagehide", () => {
        window.nostosChildWorker?.terminate();
        worker.postMessage({ cmd: "close" });
      });

      document.getElementById("status").textContent = "worker spawned — drive via window.nostos*";
      log("harness ready");
    </script>
  </body>
</html>
