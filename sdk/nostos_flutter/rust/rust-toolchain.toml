[toolchain]
# native_toolchain_rust requires an exact channel version/date for reproducible
# builds. Pinned to match the root nostos workspace's rust-toolchain.toml
# (1.95.0) — this crate path-deps on nostos-client/nostos-core/nostos-domain,
# which declare rust-version = "1.95" (workspace.package), so an older pin
# here fails to build them.
channel = "1.95.0"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "armv7-linux-androideabi",
  "wasm32-unknown-unknown",
  "x86_64-apple-darwin",
  "x86_64-apple-ios",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
