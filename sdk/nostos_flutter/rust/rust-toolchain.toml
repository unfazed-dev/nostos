[toolchain]
# Tracks the LATEST stable, mirroring the root nostos workspace rust-toolchain.toml
# (standing rule 2026-09-21). Kept as its own file so the SDK builds the same
# way when vendored without the root. The path-deps (nostos-client/core/domain)
# declare rust-version = 1.98 (workspace.package); an older pin here fails.
# Verified 2026-09-21: rustc 1.98.1 also fixes the 1.95 "mis-aligned LINKEDIT
# string pool" dlopen failure of the release cdylib on macOS 27.
channel = "stable"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "armv7-linux-androideabi",
  "wasm32-unknown-unknown",
  "x86_64-apple-darwin",
  "x86_64-apple-ios",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
