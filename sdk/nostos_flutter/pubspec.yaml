name: nostos_flutter
description: "Plug-and-play local-first sync for Flutter — Rust-owned SQLite + WebSocket sync loop, no connector class, no client-side schema artifact."
# Pre-release head, not a published version: 0.1.0 was never published to
# pub.dev (no GitHub remote, release pipeline never ran — see README's
# Releases section), and the repo's v0.1.0 git tag predates this sdk/ tree
# entirely, so no tag has ever carried this package. 40+ commits of API
# drift (typed reads/writeBatch/predicates, CRDT tiers, web engine,
# syncStream, push-token REST) make the tree a superset of what the 0.1.0
# CHANGELOG entry describes — the -dev suffix keeps the moving head
# unambiguous for path-dep consumers and can't be accidentally published
# as stable. First flutter-carrying tag (v0.2.0) is cut when the release
# pipeline runs for real — an operator call.
version: 0.2.0
# NOSTOS-IDENTITY-PENDING: no domain registered — see docs/IDENTITY.md
homepage: https://github.com/unfazed-dev/nostos
repository: https://github.com/unfazed-dev/nostos

environment:
  # Latest stable floor (standing rule 2026-09-21): Dart 3.13 / Flutter 3.47.
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned exactly, not a caret range: 2.12.0 (this machine's prior global
  # install) silently lacks --integration-backend entirely, and the
  # native-assets backend + prebuilt-manifest mechanism this package's
  # hook/build.dart relies on is beta-versioned — see
  # docs/plans/w4-packaging-fallback.md (W0a spike) for why an exact pin
  # matters here more than it usually would.
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  # Default SQLite storage location (getApplicationSupportDirectory) — the
  # "zero manual steps" default for Nostos.connect(); override via
  # Nostos.connect(sqlitePath: ...) if you don't want this dependency's
  # platform channels.
  path_provider: ^2.1.0
  meta: ^1.9.0
  # Used by NostosDatabase.connect to fetch `GET {base}/schema` when no Schema
  # is passed explicitly. Lightweight, Dart-native, no extra native deps.
  http: ^1.2.0
  # Used by NostosDatabase.supabase to read the live Supabase session token
  # (`Supabase.instance.client.auth.currentSession`). Caller pre-inits
  # Supabase at app start; this package only reads the session here. Brings
  # `http` transitively (harmless dup of the explicit dep above).
  supabase_flutter: ^2.8.0
  # Used directly by hook/build.dart (the prebuilt/cargo-fallback build hook)
  # — already pulled in transitively by flutter_rust_bridge_hooks /
  # native_toolchain_rust; declared directly here only to satisfy
  # `depend_on_referenced_packages` and pin what hook/build.dart imports.
  code_assets: ^1.2.1
  hooks: ^2.0.2
  # sha256 verification in hook/build.dart (W6): pure-Dart, cross-platform —
  # replaces a `shasum` subprocess call, which is unix-only and breaks the
  # Windows leg (see README's Packaging mechanism section). Already resolved
  # transitively at 3.0.7 (pulled in by flutter_test); pinned directly here
  # for the same `depend_on_referenced_packages` reason as code_assets/hooks
  # above.
  crypto: ^3.0.7
  # Wave 4b (ADR-0036): the WebNostosEngine Worker adapter (web_worker_port.dart)
  # drives the shared nostos-ffi-wasm backend via this package's `Worker` + the
  # `dart:js_interop` extensions it ships. Only imported on web (conditional
  # import in engine_selector), so it adds zero weight to native builds.
  web: ^1.1.0
  # The web plugin registrant (lib/web/nostos_flutter_web.dart) imports this;
  # declared directly to satisfy `depend_on_referenced_packages`. SDK-only,
  # zero weight on native.
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # Provides FakeAsync for the watchQuery(throttle) burst-coalesce test.
  # Already resolved transitively via flutter_test; declared directly here
  # only to satisfy `depend_on_referenced_packages`.
  fake_async: ^1.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: run.nostos.nostos_flutter
        pluginClass: NostosFlutterPlugin
      ios:
        pluginClass: NostosFlutterPlugin
      macos:
        pluginClass: NostosFlutterPlugin
      # Wave 4b (ADR-0036): Flutter-web target. Nostos-web uses NO method
      # channel — the conditional import selects WebNostosEngine (over the
      # shared nostos-ffi-wasm Worker) at compile time. The registrant is a
      # no-op stub that exists only so Flutter's plugin tooling recognizes web
      # as a supported platform (and `flutter build web` doesn't warn about a
      # missing web implementation).
      web:
        pluginClass: NostosFlutterWeb
        fileName: web/nostos_flutter_web.dart

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
