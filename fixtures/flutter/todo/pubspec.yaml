name: todo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.15.4
  # NostosTodoRepository.connect computes a per-app default sqlite path when
  # the caller doesn't pass one (matches the legacy Nostos.connect default
  # path pattern, since NostosDatabase.connect now REQUIRES sqlitePath).
  path_provider: ^2.1.5
  # W5 showcase: "local live" mode (real nostos-server, no Supabase project
  # yet — W0b is operator-blocked). Path dep on the in-repo SDK; a real
  # consumer app pins `nostos_flutter: ^x.y.z` from pub.dev once W6 publishes it.
  nostos_flutter:
    path: ../../../sdk/nostos_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
