<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!-- Lexend variable — readability-tuned, the Nostos typeface. preconnect for fast first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- No-flash theme bootstrap: resolve the saved/system theme BEFORE first
         paint so the right token block is active on the very first frame.
         data-theme="system" is the default and follows prefers-color-scheme;
         the nav ThemeToggle persists an explicit override here. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nostos-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) { /* localStorage unavailable — keep system default */ }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
