[package]
name = "nostos-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos native client — SqliteStorage backend + the tokio SyncClient (connect, apply, checkpoint, reconnect)."
repository.workspace = true
homepage.workspace = true

[features]
# Pulls in nostos-infra's real Postgres logical-replication adapter for the
# `e2e_pg_sync` test only. OFF by default — mirrors nostos-infra's own `pg`
# feature (see that crate's Cargo.toml doc).
pg = ["nostos-infra/pg"]

[dependencies]
nostos-core = { workspace = true }
nostos-domain = { workspace = true }
# Direct path dep (NOT `workspace = true`): cargo silently IGNORES a member's
# `default-features = false` on an inherited workspace dependency — verified on
# cargo 1.95 — and setting it in the root [workspace.dependencies] table would
# strip the webpush rail from every consumer (nostos-server included). A direct
# path dep is the only way THIS crate opts out of nostos-infra's default
# features: drops the `webpush` rail (web-push → ece has ONLY an OpenSSL
# backend; openssl-sys cannot cross-compile to iOS — it broke the RN iOS
# staticlib build). We use the wire codec only. The dev-dep below keeps
# `workspace = true` so host-side tests still exercise the full server spine.
nostos-infra = { path = "../nostos-infra", default-features = false }   # WireFrame decode (client ↔ server contract)
rusqlite = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
nostos-core = { workspace = true }
# Examples/tests-only: wiring the in-process FanOutService (apply_bench,
# reactive_scroll) needs nostos-application's ports. The nostos-push precedent
# (its Cargo.toml dev-deps nostos-application): dev-deps do not change the
# lib's dependency direction — [dependencies] above stays core/domain/infra.
nostos-application = { workspace = true }
nostos-infra = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
# pg-only (behind the `pg` feature above) — the e2e_pg_sync harness needs a
# control-plane SQL client (slot cleanup, direct-row assertions) and typed
# uuid binding, matching nostos-infra's own e2e_pg_* tests. The tenant-mode
# reconnect-replay e2e also needs HMAC/SHA2 to mint Supabase-shape JWTs.
tokio-postgres = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# apply_bench example CLI (derive idiom, same as nostos-bench / nostos-pushd).
# Examples build against dev-deps, so the lib gains no dependency.
clap = { workspace = true }
# sync_streams example needs tracing-subscriber for RUST_LOG output
tracing-subscriber = { workspace = true }

[lints]
workspace = true
