[package]
name = "nostos-push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "nostos-pushd — standalone push daemon (ADR-0038): token-addressed APNs / FCM / Web Push sends with debounce coalescing."
repository.workspace = true
homepage.workspace = true

# The daemon binary (ADR-0038 §1: composition root on the nostos-bench /
# nostos-cloud precedent — lib + bin in one member, NOT a feature crate).
[[bin]]
name = "nostos-pushd"
path = "src/main.rs"

[features]
default = []
# v1.1 Postgres registry (ADR-0038 §4 + addendum): the PgStore impl of
# store::Store — pool-of-one tokio-postgres client, the PgTokenStore
# pattern. Off by default (SQLite stays the single-binary default); select
# it at runtime with NOSTOS_PUSHD_DATABASE_URL. Setting that env var on a
# build without this feature is a hard startup error naming the rebuild.
pg = ["dep:tokio-postgres", "nostos-infra/push-store-pg"]

[dependencies]
nostos-domain = { workspace = true }
# Rails + RailSet, reused AS-IS (ADR-0038 §1; plan task 1.5 "no rail forks").
# Default features keep the webpush rail on — this is a server-shaped crate.
# `push-store`: the registry store (SQLite; PgStore under `push-store-pg`)
# lives in nostos-infra so the `nostos push key` CLI shares it.
nostos-infra = { workspace = true, features = ["clap", "push-store"] }

tokio = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Postgres registry backend (feature "pg", v1.1): PgStore itself is
# nostos-infra's; this client is tests/e2e_pg_store.rs's raw-SQL handle.
# Optional: already a workspace dependency, so enabling pg adds no new crates
# to the graph.
tokio-postgres = { workspace = true, optional = true }
subtle = { workspace = true }
# Digest-then-ct_eq for API-key compare (the nostos-server admin_auth.rs
# idiom) — digests are fixed 32 bytes, so there is no unequal-length branch
# before the constant-time compare starts.
sha2 = { workspace = true }
# push_id = uuid v4 (plan pin 0.4: uuid IS a workspace dep, so v4 it is).
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# HTTP-level tests against a spawned daemon (the ProviderMock idiom: real
# axum listener on 127.0.0.1:0 — no mock-HTTP crate). Already a workspace
# dep via nostos-infra's rails; adding it here pulls nothing new.
reqwest = { workspace = true }
# The delegation e2e (tests/delegation.rs, plan task 2.4) drives the REAL
# nostos-infra RemoteNotifier, which implements nostos-application's
# PushNotifier port — the port types (PushHint, Metrics, SessionStore) are
# test-only here. Dev-deps do not change the lib's dependency direction
# (pin 0.5: the daemon lib itself stays nostos-domain + nostos-infra only).
nostos-application = { workspace = true }

[lints]
workspace = true
