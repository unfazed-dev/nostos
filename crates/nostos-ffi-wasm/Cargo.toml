[package]
name = "nostos-ffi-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos WebAssembly FFI bridge — binds nostos-core's apply engine to JavaScript."
repository.workspace = true
homepage.workspace = true

# wasm-pack invokes wasm-opt by default for the release build; the cached
# binary in this env rejects rustc's bulk-memory ops (memory.copy) — and the
# extra opt pass is redundant with rustc's fat-LTO release profile, so we
# disable it. The .wasm is still fully optimized by rustc itself.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# `cdylib` → a `.wasm` artifact for wasm-bindgen/js; `rlib` → so unit tests
# (which run on the host, not wasm) still compile against this crate.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nostos-core = { workspace = true }
# Wave 4a: CRDT invariants (Hlc, OrSetElement, counter_apply_delta, merge_*) reused
# directly — NOT re-implemented in the wasm crate. nostos-domain is pure (zero I/O,
# zero async) and already a transitive dep via nostos-core; making it explicit lets
# the typed-verb orchestration name the domain types at the wasm seam.
nostos-domain = { workspace = true }
wasm-bindgen = "0.2"
# E1: the WASM WebSocket transport. `web-sys` is feature-gated per API; the
# list below is the exact surface the transport touches — anything else pulls
# dead bytes into the .wasm. `js-sys` for `js_sys::Function`/`Reflect`; 
# `wasm-bindgen-futures` bridges the async connect() Promise.
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"
# NOTE: wasm-bindgen-futures is on the 0.4 line (its versioning is independent
# of wasm-bindgen's 0.2 line — confusingly, "0.2" here would resolve to a
# 2018-era 0.2.x that pulls a broken js-sys 0.2). 0.4.x tracks wasm-bindgen 0.2.
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    # localStorage checkpoint persistence (the plan's interface contract).
    "Window",
    "Storage",
]

[dev-dependencies]
# ponytail: browser wasm-bindgen-test setup is env-flaky (needs a headless
# browser + `wasm-pack test --chrome`); the real coverage is the host cargo
# unit tests of the pure frame-pump/subscribe/checkpoint fns (which run in
# `make ci`). This dep is here so a future browser test of the WS glue can be
# added without a Cargo.toml churn; the WS glue itself is covered by the E3
# demo page manual check.
wasm-bindgen-test = "0.2"

[lints]
workspace = true
