[package]
name = "nostos-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos throughput benchmark harness — Week-1 deliverable."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nostos-bench"
path = "src/main.rs"

# A lean 10k-client probe (C3): same server + fan-out + frame-counting as
# `nostos-bench`, but it drops the per-client latency histograms (whose 10k-way
# mutex merge is what hangs the main harness's teardown at 10k) and exits hard
# via `process::exit` after the measurement window. Used to get real 10k
# before/after numbers for the batched-writes Tier comparison where the full
# harness's teardown stalls. Not the headline reporter — a measurement shim.
[[bin]]
name = "nostos-bench-10k"
path = "src/bin/probe_10k.rs"

# Reconnect-storm probe (C3 Step 4, advisor-flagged decision point): spins up N
# clients, drives a steady event stream, then mid-stream drops + simultaneously
# reconnects half of them (each re-subscribing with a resume_lsn). Records
# peak per-session queue depth proxy, drop rate during/after the storm, and
# time-to-drain. Decides whether admission control / token-bucket is needed
# before Phase D — the probe is the MEASUREMENT, not an admission-control build.
[[bin]]
name = "nostos-reconnect-storm"
path = "src/bin/reconnect_storm.rs"

# Real-Postgres ingest leg: drives a PERSISTENT-connection batched-INSERT load
# into the live `tasks` table and measures what reaches N loopback WS sinks
# through PgReplicator → FanOutService. A STAGE measurement (real-PG ingest +
# fan-out delivery) — never comparable to the eval-only FakeReplicator fan-out
# headline in benches/results/RESULTS.md. Gated behind `pg` so the default
# build pulls no Postgres crates (mirrors nostos-infra's `pg` gate).
[[bin]]
name = "nostos-bench-pg-ingest"
path = "src/bin/bench_pg_ingest.rs"
required-features = ["pg"]

[features]
# Real-Postgres ingest bench leg. Enables nostos-infra's PgReplicator plus the
# client-side crates the generator/sinks need (tokio-postgres for the load
# connection, uuid for per-run org_ids + slot suffixes, chrono for the
# write_ts→recv lag gauge and artifact timestamps).
pg = ["dep:tokio-postgres", "dep:uuid", "dep:chrono", "nostos-infra/pg"]

[dependencies]
nostos-domain = { workspace = true }
nostos-application = { workspace = true }
nostos-infra = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nix = { version = "0.29", features = ["resource"] }

# pg-only (optional — enabled by the bench `pg` feature; see [features] above)
tokio-postgres = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[lints]
workspace = true
