[package]
name = "nostos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos sync server binary (composition root)."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nostos-server"
path = "src/main.rs"

[features]
# `pg` is on by default so `cargo build -p nostos-server` includes the real
# PgReplicator. Disable it with `cargo build -p nostos-server --no-default-features`
# (the runtime default stays `NOSTOS_REPLICATOR=fake`, so a featureless binary still
# runs — it just can't be switched to the real replicator).
default = ["pg"]
pg = ["nostos-infra/pg"]
# ADR-0041 spike: --transport iroh (accept-loop bridge beside the HTTP mount).
iroh = ["nostos-infra/iroh"]

[dependencies]
nostos-domain = { workspace = true }
nostos-application = { workspace = true }
nostos-infra = { workspace = true, features = ["clap"] }
nostos-license = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
# `/ingest` payload construction (B2 mirror): RowOp payloads are bytes::Bytes.
bytes = { workspace = true }
# Task 21 admin-token gate: hash + constant-time compare NOSTOS_ADMIN_TOKEN.
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
# Mint HS256 JWTs in admin_auth.rs's supabase_jwt_is_not_admin test (mirrors
# crates/nostos-infra/tests/auth_sync.rs's hand-rolled mint_jwt).
hmac = { workspace = true }
# Push test doubles (push_api.rs, push_e2e_tests in push_config.rs): implement the
# async ports (SyncAuth/EventSink/PushSink) and build ReplicationEvent
# payloads. Mirrors the main deps the library crates already carry.
async-trait = { workspace = true }
bytes = { workspace = true }

[lints]
workspace = true
