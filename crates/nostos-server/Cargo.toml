[package]
name = "nostos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos sync server binary (composition root)."
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "nostos-server"
path = "src/main.rs"

[features]
# `pg` is on by default so `cargo build -p nostos-server` includes the real
# PgReplicator. Disable it with `cargo build -p nostos-server --no-default-features`
# (the runtime default stays `NOSTOS_REPLICATOR=fake`, so a featureless binary still
# runs — it just can't be switched to the real replicator).
default = ["pg"]
pg = ["nostos-infra/pg"]

[dependencies]
nostos-domain = { workspace = true }
nostos-application = { workspace = true }
nostos-infra = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
