[package]
name = "nostos-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Nostos infrastructure adapters — pg logical replication, tokio router, ws transport."
repository.workspace = true
homepage.workspace = true

[features]
# `webpush` is DEFAULT-ON so every server-shaped consumer (nostos-server, bench,
# cli) keeps the rail with zero manifest changes. Client crates MUST opt out
# (`default-features = false` — nostos-client does): web-push → ece has only an
# OpenSSL backend (ece 2.3.1), and openssl-sys cannot cross-compile to iOS —
# it broke the RN iOS staticlib build (sdk/nostos_react_native) until this gate.
default = ["webpush"]
webpush = ["dep:web-push"]
# The real Postgres logical-replication adapter. OFF by default — the benchmark
# uses FakeReplicator and pulls none of the pg crates. Turn on with
# `--features nostos-infra/pg` (Phase 1+).
pg = ["dep:tokio-postgres", "dep:pgoutput", "dep:pgwire-replication", "dep:chrono"]

[dependencies]
nostos-domain = { workspace = true }
nostos-application = { workspace = true }

tokio = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
dashmap = { workspace = true }

# pg-only (optional — enabled by the `pg` feature)
tokio-postgres = { workspace = true, optional = true }
pgoutput = { workspace = true, optional = true }
pgwire-replication = { workspace = true, optional = true }
# chrono: typed `DateTime<Utc>` binding for timestamptz/timestamp columns in
# PgWriteBack (ADR-0019 follow-on; tokio-postgres carries with-chrono-0_4).
chrono = { workspace = true, optional = true }

async-trait = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
# Identifier validation for the write-back adapter (D2): strict regex over
# table/column names so a client-controlled identifier can never reach SQL.
regex = { workspace = true }
# UUID parsing for typed write-back binding (D2): a pk/string that parses as a
# uuid is bound as uuid::Uuid so PG accepts it on a uuid column (text→uuid is
# not an implicit cast). Already pulled transitively by tokio-postgres.
uuid = { workspace = true }
# JWT signature verification for /sync auth (HMAC-SHA256, no SDK — mirrors
# nostos-cloud's Hs256Verifier; see ADR-0010 on why this isn't shared).
hmac = { workspace = true }
sha2 = { workspace = true }
# RS256/ES256 JWT verification against a Supabase JWKS (ADR-0010 addendum).
jsonwebtoken = { workspace = true }
# JWKS fetch over HTTPS (same crate nostos-cloud uses for the Stripe REST call).
reqwest = { workspace = true }
# nostos_rules.toml load/save (ADR-0031, Task 7) — already a nostos-cli dependency.
toml = { workspace = true }
# Web Push rail (ADR-0037 task 2.3): aes128gcm payload encryption + VAPID
# ES256 signing. The HTTP send rides the reqwest client above.
# OPTIONAL (`webpush` feature, default-on): ece's only backend is OpenSSL,
# which cannot cross-compile to iOS — client crates must not pull this.
web-push = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
# tracing-subscriber: used by the e2e_server spine example (and only there) to
# init log output. The lib itself relies on the host binary to install a
# subscriber, so this stays out of [dependencies].
tracing-subscriber = { workspace = true }
# Used by the pg-feature e2e test to mint unique row titles.
uuid = { workspace = true }
# JWKS fixture-server tests: mint RSA/EC/Ed25519 keypairs + JWKs, serve them
# over a local axum listener (axum is already a non-dev dependency above).
rsa = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
