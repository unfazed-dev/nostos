[licenses]
allow = [
  "Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0",
  # CDLA-Permissive-2.0: webpki-roots bundles the Mozilla CA root list, which is
  # licensed CDLA-Permissive-2.0 (pulled in transitively via reqwest/hyper-rustls).
  "CDLA-Permissive-2.0",
  # MPL-2.0: `ece` (RFC 8188 aes128gcm) implements Web Push payload encryption
  # for nostos-push. MPL-2.0 is file-level weak copyleft — linking from this
  # Apache-2.0 workspace is unencumbered; obligations attach only if we modify
  # ece's own files, which we don't. Sole MPL-2.0 crate in the graph.
  "MPL-2.0",
  # Unlicense: public-domain dedication — strictly more permissive than MIT,
  # which is already allowed. Needed because ws_stream_wasm / pharos /
  # async_io_stream (the wasm websocket stack) are Unlicense-ONLY, not the
  # usual `MIT OR Unlicense` dual that resolves to MIT on its own.
  "Unlicense",
]

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin Attack): non-constant-time RSA PRIVATE-key
  # operations (decrypt/sign) can leak the private key via timing. Pulled in
  # by `rsa` v0.9, reachable two ways:
  #   - jsonwebtoken's `rust_crypto` backend (crates/nostos-infra, ADR-0010
  #     JWKS addendum) — used ONLY for RS256 verification against a public
  #     key fetched from a Supabase JWKS. Verification is a public-key
  #     operation; there is no private key in this process for the timing
  #     leak to expose. The advisory's own workaround ("local use on a
  #     non-compromised computer is fine") describes exactly this shape —
  #     no network-observable private-key operation exists in our runtime.
  #   - nostos-infra's `rsa`/`p256` dev-dependencies, used only to mint
  #     ephemeral RSA/EC test keys for the JWKS fixture-server test suite
  #     (ephemeral private keys, generated and discarded per test run,
  #     never reachable over a network).
  # No safe upgrade exists (RustCrypto tracking issue is still open as of
  # this writing). Revisit if jsonwebtoken/rsa ship a constant-time fix, or
  # if any production code path ever performs an RSA private-key operation.
  "RUSTSEC-2023-0071",
  # The two below are `unmaintained`, not vulnerabilities, and both arrive
  # transitively under the OFF-DEFAULT `iroh` feature — nothing we ship by
  # default links them, and neither is fixable from this workspace. Listed as
  # explicit IDs rather than relaxing `unmaintained` wholesale, so a future
  # unmaintained crate still fails the build.
  # atomic-polyfill: superseded by portable-atomic (already in the graph);
  # retires when the iroh chain finishes migrating.
  "RUSTSEC-2023-0089",
  # paste: feature-complete proc-macro, archived by its author. Retires when
  # the iroh chain drops it.
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
