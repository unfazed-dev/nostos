[toolchain]
# Tracks the LATEST stable (standing rule 2026-09-21: nostos always builds on the
# newest stable Rust/Flutter/Dart). `rustup update stable` moves everyone at
# once; Cargo.lock keeps dependency builds reproducible. MSRV in Cargo.toml
# `rust-version` follows the same release (1.98 as of 2026-09-21).
channel = "stable"
components = ["rustfmt", "clippy", "rust-src"]
# Native + the SDK targets we ship from day one (Flutter/RN/Web/Node).
targets = [
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
profile = "minimal"
