# PowerSync sync rules — mirror Nostos's benchmark `tasks` workload.
#
# This is the minimal sync rule PowerSync needs to expose the `tasks` table
# (the same table Nostos's FakeReplicator + PgReplicator fan out). It grants
# every authenticated client read access to all rows — the simplest correct
# rule for a local-only comparison smoke test (no multi-tenant scoping).
#
# See: https://docs.powersync.com/configuration/sync-rules
bucket_definitions:
  my_bucket:
    data:
      - select * from tasks
