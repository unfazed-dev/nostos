# PowerSync self-host stack for the Nostos comparison smoke test.
#
# Brings up the PowerSync Service (Open Edition) against the SAME Postgres the
# nostos-infra PgReplicator reads (the `postgres` service in docker-compose.yml).
# This lets the `powersync_smoke` integration test prove a row inserted into PG
# is ingested by PowerSync and surfaced on its sync stream — validating the
# self-host path and that the comparison artifact exists.
#
# NOT a throughput race. The live head-to-head is deferred per
# docs/COMPARISON.md: PowerSync's client SDK applies to SQLite on the receive
# path, so a live throughput comparison would measure their full client
# pipeline against Nostos's raw-WS fan-out (apples vs oranges). The benchmark
# compares against PowerSync's PUBLISHED server ceiling (2–4k ops/sec).
#
# Usage:
#   make ps-up        # start Postgres + PowerSync
#   make ps-down      # stop both
#   make ps-logs      # tail PowerSync logs
#   NOSTOS_POWERSYNC=1 cargo test -p nostos-infra --test powersync_smoke -- --nocapture
#
# Requires the base Postgres stack from docker-compose.yml to be running
# (`make pg-up`); this compose extends it.
services:
  powersync:
    image: journeyapps/powersync-service:latest
    container_name: nostos-powersync
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PowerSync reads its config from PSCONFIG or a mounted YAML. We mount
      # the YAML below; these env vars override the few paths that matter.
      POWERSYNC_CONFIG: /app/config.yaml
    volumes:
      - ./powersync/config.yaml:/app/config.yaml:ro
      - ./powersync/sync-rules.yaml:/app/sync-rules.yaml:ro
    ports:
      # PowerSync's sync API + health. 8080 host to avoid clashing with the
      # nostos-server (8800) / nostos-cloud (9090).
      - "8080:8080"
    networks:
      - default
    healthcheck:
      # The service exposes /healthcheck (returns 200 when replication is wired).
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  default:
    name: nostos
