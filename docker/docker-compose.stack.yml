# Nostos — full stack compose.
#
# Brings up the whole launchable product:
#   postgres     — the source DB (logical replication enabled)
#   nostos-server — the sync engine (real PgReplicator → fan-out → WebSocket)
#   nostos-cloud  — the control plane (accounts, projects, billing, admin SPA, landing)
#   nostos-pushd  — the standalone push daemon (ADR-0038; APNs/FCM/Web Push)
#
#   docker compose -f docker/docker-compose.stack.yml up --build
#
# Then:
#   Landing + admin:  http://localhost:9090        (cloud)
#   Sync WebSocket:   ws://localhost:8800/sync     (server)
#   Postgres:         localhost:5433 (cairn/cairn)
#
# First-run: visit http://localhost:9090/admin and sign up — the first account
# becomes the Founder. Stripe is optional (endpoints 503 without keys).

services:
  postgres:
    image: postgres:16-alpine
    container_name: nostos-stack-postgres
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=20"
      # 20 (not PG default 10): the real-PG e2e suite runs concurrent test
      # binaries, each creating a logical slot; 10 is exhausted across leaky runs.
      - "-c"
      - "max_replication_slots=20"
      - "-c"
      - "max_connections=200"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 5s
      timeout: 3s
      retries: 20

  nostos-server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nostos:latest
    container_name: nostos-stack-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOSTOS_BIND: "0.0.0.0:8800"
      NOSTOS_REPLICATOR: pg
      NOSTOS_PG_URL: "postgresql://cairn:cairn@postgres:5432/cairn"
      NOSTOS_PG_SLOT: cairn_slot
      NOSTOS_PG_PUBLICATION: cairn_pub
      NOSTOS_LOG: "info,nostos=debug"
      RUST_LOG: "info,nostos=debug"
    command: ["nostos-server"]
    ports:
      - "8800:8800"

  nostos-cloud:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nostos:latest
    container_name: nostos-stack-cloud
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOSTOS_CLOUD_BIND: "0.0.0.0:9090"
      NOSTOS_LICENSE_SECRET: "change-me-in-production"
      NOSTOS_CLOUD_DB: "/data/nostos-cloud.db"
      NOSTOS_CLOUD_PUBLIC_URL: "http://localhost:9090"
      # Optional — uncomment + set to enable billing:
      # STRIPE_SECRET_KEY: sk_test_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
      # STRIPE_PRICE_PRO: price_...
      RUST_LOG: "info,nostos_cloud=debug"
    command: ["nostos-cloud"]
    ports:
      - "9090:9090"
    volumes:
      - cloud-data:/data

  nostos-pushd:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nostos:latest
    container_name: nostos-stack-pushd
    environment:
      NOSTOS_PUSHD_BIND: "0.0.0.0:8090"
      NOSTOS_PUSHD_DB: "/data/cairn-pushd.db"
      # Required — tenant:secret API-key pairs, comma-separated:
      # Keys nostos-server delegates with (NOSTOS_PUSH_REMOTE_KEY) MUST carry
      # the ":rail" role suffix, e.g. "hq:delegator-key:rail".
      NOSTOS_PUSHD_API_KEYS: "demo:change-me-in-production"
      # Optional rails — unset = rail off (from_env semantics, ADR-0038 §1):
      # NOSTOS_FCM_CREDENTIALS_JSON: /run/secrets/fcm.json
      # NOSTOS_APNS_KEY_P8: /run/secrets/apns.p8
      # NOSTOS_APNS_KEY_ID: your-key-id
      # NOSTOS_APNS_TEAM_ID: your-team-id
      # NOSTOS_APNS_BUNDLE_ID: com.example.app
      # NOSTOS_WEBPUSH_VAPID_PRIVATE_KEY: base64url-p256-scalar
      # NOSTOS_WEBPUSH_VAPID_SUBJECT: mailto:ops@example.com
      RUST_LOG: "info,nostos_push=debug"
    command: ["nostos-pushd"]
    ports:
      - "8090:8090"
    volumes:
      - pushd-data:/data

volumes:
  pgdata:
  cloud-data:
  pushd-data:
