# =============================================================================
# Nostos — workspace root
# =============================================================================
# An open, Rust-fast, local-first sync engine. Postgres logical replication →
# every device, even offline. No static buckets. No write-back endpoints.
#
# Repository layout follows Ports & Adapters (hexagonal) + DDD:
#
#   dependency direction:   bootstrap ─► application ─► domain  ◄─ infrastructure
#                                                     ◄───────── (adapters implement ports)
#
#   nostos-domain          enterprise/business layer — PURE: zero I/O, zero async,
#                         zero framework deps. Types + invariants only.
#   nostos-application     use-cases + port traits (interfaces). Depends ONLY on
#                         domain. Defines what the system DOES, not HOW.
#   nostos-infra           adapter implementations (pg logical replication, in-memory
#                         session store, tokio fan-out router, websocket transport,
#                         wire codec). Implements application ports. The ONLY place
#                         tokio/axum/postgres live.
#   nostos-server          the composition root / main binary. Wires adapters to
#                         ports and runs an axum HTTP/WS server.
#   nostos-bench           the benchmark harness — Week-1 deliverable: measures the
#                         aggregate fan-out throughput (the headline moat).
#   nostos-core            the platform-agnostic client sync engine — pure Rust
#                         (no tokio, no SQLite): the Storage seam + the apply
#                         state machine. WASM-clean; what the FFI bridges bind.
#   nostos-client          the native client: SqliteStorage (rusqlite) + the
#                         tokio SyncClient that connects to /sync, applies frames,
#                         checkpoints durably, and reconnects with resume_lsn.
#   nostos-ffi-wasm        the WebAssembly FFI bridge — binds nostos-core's apply
#                         engine to JavaScript (wasm-bindgen). The first FFI
#                         target; Flutter/RN/Node follow the same nostos-core.
#
# Rule enforced by structure + clippy: domain must never depend on application,
# application must never depend on infrastructure. The dependency-inversion arrow
# always points inward.
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/nostos-domain",
    "crates/nostos-application",
    "crates/nostos-infra",
    "crates/nostos-server",
    "crates/nostos-bench",
    "crates/nostos-cloud",
    "crates/nostos-license",
    "crates/nostos-core",
    "crates/nostos-client",
    "crates/nostos-ffi-wasm",
    "crates/nostos-cli",
    "crates/nostos-push",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
# NOSTOS-IDENTITY-PENDING: legal entity + contact mailbox undecided — docs/IDENTITY.md
authors = ["unfazed-dev"]
repository = "https://github.com/unfazed-dev/nostos"
# NOSTOS-IDENTITY-PENDING: no domain registered yet — the repo IS the homepage
homepage = "https://github.com/unfazed-dev/nostos"
documentation = "https://github.com/unfazed-dev/nostos/tree/main/docs"
readme = "README.md"
keywords = ["sync", "local-first", "postgres", "offline", "replication"]
categories = ["database", "database-implementations"]

# -----------------------------------------------------------------------------
# Shared dependency versions — single source of truth (referenced as
# `serde.workspace = true` from member crates).
# -----------------------------------------------------------------------------
[workspace.dependencies]
# --- domain (kept minimal: only serde + uuid for cross-boundary value types) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde", "js"] }
bytes = { version = "1.7", features = ["serde"] }
thiserror = "1.0"

# --- application (ports + use-cases) ---
async-trait = "0.1"
tracing = "0.1"
dashmap = "6.1"
# Identifier validation for the write-back adapter (D2): strict regex over
# table/column names so a client-controlled identifier can never reach SQL.
regex = "1.10"

# --- infrastructure / async runtime ---
tokio = { version = "1.39", features = ["full"] }
futures-util = "0.3"
# rustls + bundled roots: every Realtime doorbell URL is wss://, and without a
# TLS feature `connect_async` fails with "TLS support not compiled in" (the
# client then silently lives on the 30 s backoff resync). Not native-tls:
# openssl-sys cannot cross-compile to iOS.
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
iroh = "1.1"
iroh-tickets = "1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# --- postgres logical replication (the core capability) ---
# Used by the real PgReplicator (Phase 1). Week-1 benchmark uses a FakeReplicator
# and needs none of these — they're marked optional in nostos-infra.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
# chrono: typed ToSql binding for timestamptz/timestamp columns in PgWriteBack
# (the matching `with-chrono-0_4` tokio-postgres feature above gives
# `DateTime<Utc>` its `ToSql` impl). pg-only (nostos-infra, behind `pg`).
chrono = "0.4"
# pgoutput logical-decoding parser (consumes the pgoutput replication stream).
# Verified 0.0.7: trait-selected generic Event<Binary,Streaming> API; we use the
# `BinaryValueTraitOff` (text values) + `StreamingValueTraitOff` (no streaming) monomorphization.
pgoutput = "0.0.7"
# Tokio-based PG wire-protocol logical-replication client (TLS + SCRAM).
# Verified 0.3.2: ReplicationClient::connect(cfg) -> recv() -> Option<ReplicationEvent>,
# where XLogData{ wal_end: Lsn, data: Vec<u8> } carries raw pgoutput message bytes.
pgwire-replication = "0.3"

# --- observability ---
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- config / error / cli ---
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
# nostos.toml (de)serialization for nostos-cli.
toml = "0.8"
# TLS for nostos-cli's control-plane connections to managed Postgres (Supabase
# requires TLS on its direct/pooler connections). Kept OUT of nostos-infra: the
# server's PgReplicator control-plane + replication connections still use
# NoTls (see crates/nostos-infra/src/replicator/pg.rs) — that gap is unchanged
# by this crate. rustls (not native-tls) to reuse the crypto provider already
# pulled in by reqwest's rustls-tls feature below.
rustls = "0.23"
tokio-postgres-rustls = "0.13"
webpki-roots = "0.26"

# --- nostos-cloud (control plane: auth, billing, projects) ---
# rusqlite = embedded sqlite for the cloud store (zero external deps to run).
rusqlite = { version = "0.32", features = ["bundled"] }
# HTTP client for Stripe REST calls (Checkout sessions, customer portal).
# `http2` is needed by the APNs push rail (api.push.apple.com rejects
# HTTP/1.1; h2 is negotiated via ALPN) — the default-features=false list
# would otherwise drop it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
# Webhook signature verification — HMAC-SHA256 (Stripe spec), no SDK needed.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Constant-time comparisons (Task 21 admin-token gate on PUT /rules). Already
# present transitively via ed25519-dalek; promoted to a direct workspace dep
# rather than hand-rolling a timing-safe compare.
subtle = "2.6"
# Timestamps for license/subscription expiry & audit.
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
# Cookie/session handling for the admin SPA auth.
tower-cookies = "0.10"
# Random token generation (API keys, session ids, license keys).
rand = "0.8"

# --- Supabase JWKS auth (nostos-infra, ADR-0010 addendum) ---
# RS256/ES256 JWT verification against a Supabase JWKS. Handles JWK -> DecodingKey
# parsing and strict algorithm pinning so we don't hand-roll RSA/ECDSA verification.
# jsonwebtoken 10 requires picking a crypto backend explicitly; "rust_crypto"
# (pure Rust, MIT/Apache) matches the RustCrypto family we already pull in via
# rsa/p256 for tests, rather than adding a second crypto stack (aws-lc-rs).
# "use_pem" is a jsonwebtoken default feature the no-default list below would
# drop — restored here for the push rails' service-account (.pem) and APNs
# (.p8) keys (from_rsa_pem / from_ec_pem).
jsonwebtoken = { version = "10", default-features = false, features = [
  "rust_crypto",
  "use_pem",
] }
# Test-only: mint RSA/EC/Ed25519 keypairs + JWKs for the JWKS fixture-server
# tests (nostos-infra dev-dependencies only — never a runtime dependency).
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }

# --- Web Push rail (nostos-infra, ADR-0037 task 2.3) ---
# RFC 8188/8291 aes128gcm payload encryption + RFC 8292 VAPID signing —
# the two pieces not worth hand-rolling. Built-in HTTP clients (isahc/hyper)
# disabled: nostos sends over its shared reqwest client.
# CVE-2025-53604 / RUSTSEC-2025-0015 (Content-Length OOM in those built-in
# clients) is patched >=0.10.3 per rustsec.org (0.10.3 was yanked; GHSA
# flags <0.10.4) — pinning 0.11 clears every advisory threshold.
# OPTIONAL in nostos-infra behind its `webpush` feature (default-on there):
# ece's only backend is OpenSSL, which cannot cross-compile to iOS, so client
# crates opt out of nostos-infra's default features.
web-push = { version = "0.11", default-features = false }

# internal crates (so members can reference each other via the workspace)
nostos-domain = { path = "crates/nostos-domain", version = "0.2.0" }
nostos-application = { path = "crates/nostos-application", version = "0.2.0" }
nostos-infra = { path = "crates/nostos-infra", version = "0.2.0" }
nostos-push = { path = "crates/nostos-push", version = "0.2.0", default-features = false }
nostos-cloud = { path = "crates/nostos-cloud", version = "0.2.0" }
nostos-license = { path = "crates/nostos-license", version = "0.2.0" }
nostos-core = { path = "crates/nostos-core", version = "0.2.0" }
nostos-client = { path = "crates/nostos-client", version = "0.2.0" }
nostos-server = { path = "crates/nostos-server", version = "0.2.0" }

# -----------------------------------------------------------------------------
# Workspace-wide lints. Fail CI on the things that matter; warn on the rest.
# -----------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pragmatism overrides — pedantic is too noisy for these in a hot path:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
# doc-style preference; we backtick code identifiers but not prose product
# names like Postgres / WebSocket throughout the docs.
doc_markdown = "allow"

[profile.release]
# Production + benchmark profile: optimize hard, keep debug symbols for profilers.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"

# Faster incremental dev builds.
[profile.dev]
opt-level = 0
debug = 1
