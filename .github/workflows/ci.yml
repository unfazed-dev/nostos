name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight runs for the same ref: three concurrent runs on main
# starved each other's runners on 2026-09-01 and failed the Postgres e2e on
# contention alone. Deliberately NOT set on release.yml — cancelling a
# half-finished release build would publish a partial artifact set.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --include-ignored

  e2e-pg:
    name: real-Postgres logical-replication e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres (logical replication + publication from pg-init)
        run: |
          docker compose -f docker/docker-compose.yml up -d
          # Wait for Postgres to be fully ready.
          #
          # The official entrypoint runs a TEMPORARY server to apply
          # /docker-entrypoint-initdb.d, then stops it and starts the real one.
          # pg-init/01-sources.sql creates `cairn_pub` ON THAT TEMPORARY SERVER,
          # so "the publication exists" does NOT prove the real server is up —
          # the previous version of this gate broke out of the poll during init
          # and the next psql landed in the restart gap. Observed 2026-09-01
          # (run 33490859076): "Postgres ready ... after 2s", immediately
          # followed by `connection to server on socket ... failed`, job dead in
          # 34s where a healthy run takes ~6.5min.
          #
          # Fix: require N CONSECUTIVE successes, resetting on any failure. The
          # restart window breaks the streak, so the gate can only pass once the
          # real server has been serving continuously for STREAK seconds.
          STREAK=5
          ok=0
          for i in $(seq 1 180); do
            if docker compose -f docker/docker-compose.yml exec -T postgres \
                 psql -U cairn -d cairn -tAc \
                 "SELECT 1 FROM pg_publication WHERE pubname='cairn_pub'" \
                 2>/dev/null | grep -q 1; then
              ok=$((ok + 1))
              if [ "$ok" -ge "$STREAK" ]; then
                echo "Postgres ready (cairn_pub present ${STREAK}x consecutively) after ${i}s"
                break
              fi
            else
              ok=0
            fi
            sleep 1
          done
          # Fail loudly if it never came up.
          test "$ok" -ge "$STREAK"
      - name: Run feature-gated e2e
        run: |
          NOSTOS_E2E_PG=1 \
          NOSTOS_PG_URL=postgresql://cairn:cairn@localhost:5433/cairn \
          cargo test -p nostos-infra --features pg -- --nocapture --test-threads=1
      - name: Tear down Postgres
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans

  sdk-e2e:
    name: SDK live-replication e2e (host slices)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Until this job existed, `scripts/sdk-e2e.sh` was a manual ritual: nothing
    # in CI ran it, so a change that broke an SDK's live PUSH+ECHO round-trip
    # merged green. The workspace test job doesn't cover it — these slices drive
    # each SDK's real public API against a spawned spine, not library internals.
    #
    # Only the two slices that need nothing beyond Rust + Node run here:
    # `rust` (plain cargo test) and `node` (builds the addon from source —
    # nostos_node.node is gitignored, not committed — and smoke_live.cjs imports
    # node builtins only, so there is no npm install to drift).
    #
    # `tauri` JOINED this job 2026-08-27 (Track A4 of the arxa integration
    # plan): the conformance suite (tests/conformance.rs — the 5-item
    # adapter.md contract ported to the Tauri surface) must run in CI next to
    # the other SDKs, not only locally. It needs the webkit/soup/gtk dev
    # packages to compile `tauri = "2"` on ubuntu-latest — the apt step below
    # installs them. If that apt step proves flaky, drop `tauri` from the
    # slice list before deleting the comment: the local `make sdk-e2e tauri`
    # remains the fallback gate.
    #
    # web/capacitor need Playwright browsers, and swift/kotlin/reactnative need
    # a booted device — all local-only. (dotnet joined this CI job 2026-08-05.)
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      # tauri slice: `tauri = "2"` needs the webkit2gtk-4.1 / soup3 / gtk-3
      # dev packages at compile time on ubuntu-latest (runtime webview is
      # never launched — the slice is `cargo test`, not a GUI run).
      - name: Install Tauri system deps (webkit/gtk headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev
      - name: Run host SDK e2e slices
        # SDK_E2E_STRICT=1 makes a SKIP fatal. Naming the slices is not enough
        # on its own: the guards inside the script would still let a slice skip
        # (e.g. a missing toolchain) and the job would pass having proved
        # nothing — the same false-green shape as the self-skipping
        # NOSTOS_E2E_PG suite. Strict mode is what makes this job's green mean
        # "every named slice's round-trip actually ran". `dotnet` builds the
        # UniFFI cdylib + C# smoke and runs a live PUSH+ECHO round-trip — the
        # gate that catches a stale committed nostos.cs (e.g. signOut/setToken
        # missing, the 2026-08-05 defect).
        run: SDK_E2E_STRICT=1 ./scripts/sdk-e2e.sh rust node dotnet tauri
      - name: Upload slice logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-e2e-logs
          path: /tmp/sdk-e2e-*.log
          if-no-files-found: ignore

  flutter:
    name: nostos_flutter — analyze + test
    # macos-latest, not ubuntu-latest: the only host build path this SDK has
    # locally verified is macOS (see sdk/nostos_flutter/README.md's Platforms
    # table — Linux isn't a supported target for the Flutter glue crate yet,
    # v1 is macOS/iOS/Android). `flutter test` still invokes
    # hook/build.dart's native-assets build hook for the *host* platform
    # (cargo-fallback, since hook/prebuilt.json has no GitHub Release URLs
    # yet), so running this on a platform we haven't validated the hook
    # against would be new, untested surface, not just CI plumbing.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Latest stable (standing rule 2026-09-21: nostos builds on the newest
          # stable Flutter/Dart). Bump this + pubspec.yaml's environment floor
          # together; the W0a spike notes (docs/plans/w4-packaging-fallback.md)
          # explain why the two drifting apart causes confusing failures.
          flutter-version: "3.47.5"
          channel: "stable"
      - name: Enable native assets (still an opt-in flag on this Flutter/Dart era)
        run: flutter config --enable-native-assets
      # No GitHub Release exists yet, so every `flutter test` run here takes
      # hook/build.dart's cargo-build fallback path — needs a Rust toolchain.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: flutter pub get
        working-directory: sdk/nostos_flutter
        run: flutter pub get
      # Formatter tracks the latest stable Dart (standing rule 2026-09-21): the
      # 3.13 formatter re-flowed 22 files that older Dart had accepted.
      - name: dart format --set-exit-if-changed
        working-directory: sdk/nostos_flutter
        run: dart format --set-exit-if-changed -o none lib test example/lib
      - name: flutter analyze
        working-directory: sdk/nostos_flutter
        run: flutter analyze
      # `flutter test` RESTORED 2026-08-05: the facade + ws6 tests (+ signOut)
      # were un-archived back into sdk/nostos_flutter/test/, so the Dart surface
      # has automated coverage again (Collection<T>/SyncStatus/watch + write-
      # outcome + signOut). Runs via hook/build.dart's cargo-fallback (Rust
      # toolchain installed above). Closes the "flagship SDK has no Dart test
      # coverage" gap the 2026-07-30 archive opened.
      - name: flutter test
        working-directory: sdk/nostos_flutter
        run: flutter test
      # The reference consumer (docs/plans/nostos-integration-tauri-flutter-push.md
      # Track C): apps/atlet pins nostos_flutter by path and carries the frozen
      # SyncAdapter contract v1.1 + the push pilot. Gating it here keeps the
      # reference honest — an SDK change that breaks the documented adoption
      # path (adapters, push_pilot, conformance tests) fails CI instead of
      # drifting. Same runner/toolchain as the SDK steps above (atlet's path
      # dep pulls the same native-assets cargo fallback); 107 tests, ~7s
      # after deps.
      - name: atlet reference app — pub get + analyze + test
        working-directory: apps/atlet/flutter
        run: |
          # ponytail: Flutter 3.47 SwiftPM copies plugins that depend on other
          # plugins (firebase_messaging -> firebase_core) into
          # build/<os>/SourcePackages with rsync and never mkdir -p's the parent,
          # so `pub get` on a fresh checkout dies with "rsync error (code 11)".
          # Pre-create the dirs; drop once flutter_tools creates them itself.
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter pub get
          dart format --set-exit-if-changed -o none lib test integration_test
          flutter analyze
          flutter test
      # The doc-signature guard: parses the fenced Dart in README.md / USAGE.md
      # / docs/api/flutter.md and fails when a snippet names a NostosDatabase
      # factory parameter that does not exist in lib/. `make ci` is Rust-only and
      # `dart analyze` does not compile fenced markdown, so this is the only
      # thing preventing prose from drifting from the real factories.
      - name: doc signatures match real factories
        run: python3 sdk/nostos_flutter/scripts/check-doc-signatures.py
      # The glue crate is a deliberate non-workspace member (ADR-0015
      # addendum), so the workspace-wide clippy/test jobs never see it —
      # gate its Rust here explicitly.
      - name: clippy + test (rust glue crate)
        working-directory: sdk/nostos_flutter/rust
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  benchmark:
    name: throughput benchmark (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Benchmarks are expensive; only run a small smoke version on CI to keep
    # PRs honest. Full benchmark runs happen on a dedicated runner + locally.
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: smoke benchmark (1k clients, 10k events)
        run: |
          cargo run --release --bin nostos-bench -- \
            --clients 1000 --events 10000 --out-dir benches/results-smoke

  # TypeScript SDK typecheck gate (ADR-0015). The Rust workspace `make ci` never
  # sees the JS/TS SDKs, so a drift like the dotnet `nostos.cs` missing signOut or
  # RN-Android missing watchChanges can ship silently. This lean job runs the
  # pure-TS typecheck (tsc --noEmit) for the two SDKs whose gate needs no native
  # cdylib / device / browser. The native SDKs (swift/kotlin/dotnet) and web
  # (wasm-pack) need heavier toolchain setup and are a follow-up.
  sdk-typecheck:
    name: ${{ matrix.sdk }} — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: nostos_react_native
            cmd: npm run typecheck
          - sdk: nostos_capacitor
            cmd: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        working-directory: sdk/${{ matrix.sdk }}
        run: npm ci
      - name: ${{ matrix.cmd }}
        working-directory: sdk/${{ matrix.sdk }}
        run: ${{ matrix.cmd }}
