name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  benchmark:
    name: throughput benchmark (smoke)
    runs-on: ubuntu-latest
    # Benchmarks are expensive; only run a small smoke version on CI to keep
    # PRs honest. Full benchmark runs happen on a dedicated runner + locally.
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: smoke benchmark (1k clients, 10k events)
        run: |
          cargo run --release --bin nostos-bench -- \
            --clients 1000 --events 10000 --out-dir benches/results-smoke
