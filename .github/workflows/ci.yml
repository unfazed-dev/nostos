name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --include-ignored

  e2e-pg:
    name: real-Postgres logical-replication e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Start Postgres (logical replication + publication from pg-init)
        run: |
          docker compose -f docker/docker-compose.yml up -d
          # Wait for Postgres to be fully ready. We gate on the publication
          # existing rather than on `pg_isready` alone: during first init the
          # entrypoint runs a *temporary* server to apply pg-init scripts, then
          # restarts into the real server, so `pg_isready` flips accepting ->
          # rejecting -> accepting and can fool a plain readiness poll. The
          # `cairn_pub` publication only exists once the real server is up AND
          # pg-init/01-sources.sql has run — which is exactly the precondition
          # the e2e tests need. Poll until present (timeout 60s).
          for i in $(seq 1 60); do
            if docker compose -f docker/docker-compose.yml exec -T postgres \
                 psql -U cairn -d cairn -tAc \
                 "SELECT 1 FROM pg_publication WHERE pubname='cairn_pub'" \
                 | grep -q 1; then
              echo "Postgres ready (publication cairn_pub present) after ${i}s"
              break
            fi
            sleep 1
          done
          # Final check: fail loudly if it never came up.
          docker compose -f docker/docker-compose.yml exec -T postgres \
            psql -U cairn -d cairn -tAc \
            "SELECT 1 FROM pg_publication WHERE pubname='cairn_pub'" | grep -q 1
      - name: Run feature-gated e2e
        run: |
          NOSTOS_E2E_PG=1 \
          NOSTOS_PG_URL=postgresql://cairn:cairn@localhost:5433/cairn \
          cargo test -p nostos-infra --features pg -- --nocapture --test-threads=1
      - name: Tear down Postgres
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans

  sdk-e2e:
    name: SDK live-replication e2e (host slices)
    runs-on: ubuntu-latest
    # Until this job existed, `scripts/sdk-e2e.sh` was a manual ritual: nothing
    # in CI ran it, so a change that broke an SDK's live PUSH+ECHO round-trip
    # merged green. The workspace test job doesn't cover it — these slices drive
    # each SDK's real public API against a spawned spine, not library internals.
    #
    # Only the two slices that need nothing beyond Rust + Node run here:
    # `rust` (plain cargo test) and `node` (builds the addon from source —
    # nostos_node.node is gitignored, not committed — and smoke_live.cjs imports
    # node builtins only, so there is no npm install to drift).
    #
    # `tauri` is deliberately EXCLUDED despite also being "just cargo":
    # sdk/nostos_tauri depends on `tauri = "2"`, which needs libwebkit2gtk-4.1-dev
    # / libsoup / libgtk-3-dev system packages to compile on bare ubuntu-latest.
    # Adding that apt step to gate a thin wrapper trades a reliable job for a
    # fragile one; it stays covered by the local `make sdk-e2e`. Add it here if
    # the webkit deps ever become worth maintaining.
    #
    # web/capacitor need Playwright browsers, dotnet needs the .NET SDK, and
    # flutter/swift/kotlin/reactnative need a booted device — all local-only.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run host SDK e2e slices
        # SDK_E2E_STRICT=1 makes a SKIP fatal. Naming the slices is not enough
        # on its own: the guards inside the script would still let a slice skip
        # (e.g. a missing toolchain) and the job would pass having proved
        # nothing — the same false-green shape as the self-skipping
        # NOSTOS_E2E_PG suite. Strict mode is what makes this job's green mean
        # "both round-trips actually ran".
        run: SDK_E2E_STRICT=1 ./scripts/sdk-e2e.sh rust node
      - name: Upload slice logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-e2e-logs
          path: /tmp/sdk-e2e-*.log
          if-no-files-found: ignore

  flutter:
    name: nostos_flutter — analyze + test
    # macos-latest, not ubuntu-latest: the only host build path this SDK has
    # locally verified is macOS (see sdk/nostos_flutter/README.md's Platforms
    # table — Linux isn't a supported target for the Flutter glue crate yet,
    # v1 is macOS/iOS/Android). `flutter test` still invokes
    # hook/build.dart's native-assets build hook for the *host* platform
    # (cargo-fallback, since hook/prebuilt.json has no GitHub Release URLs
    # yet), so running this on a platform we haven't validated the hook
    # against would be new, untested surface, not just CI plumbing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Exact pin, matching pubspec.yaml's environment.flutter floor and
          # the version the W0a packaging spike (docs/plans/w4-packaging-fallback.md)
          # verified native-assets against — see that doc's friction notes
          # for why version drift here causes confusing failures.
          flutter-version: "3.44.0"
          channel: "stable"
      - name: Enable native assets (still an opt-in flag on this Flutter/Dart era)
        run: flutter config --enable-native-assets
      # No GitHub Release exists yet, so every `flutter test` run here takes
      # hook/build.dart's cargo-build fallback path — needs a Rust toolchain.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: flutter pub get
        working-directory: sdk/nostos_flutter
        run: flutter pub get
      - name: flutter analyze
        working-directory: sdk/nostos_flutter
        run: flutter analyze
      # `flutter test` RESTORED 2026-08-05: the facade + ws6 tests (+ signOut)
      # were un-archived back into sdk/nostos_flutter/test/, so the Dart surface
      # has automated coverage again (Collection<T>/SyncStatus/watch + write-
      # outcome + signOut). Runs via hook/build.dart's cargo-fallback (Rust
      # toolchain installed above). Closes the "flagship SDK has no Dart test
      # coverage" gap the 2026-07-30 archive opened.
      - name: flutter test
        working-directory: sdk/nostos_flutter
        run: flutter test
      # The doc-signature guard: parses the fenced Dart in README.md / USAGE.md
      # / docs/api/flutter.md and fails when a snippet names a NostosDatabase
      # factory parameter that does not exist in lib/. `make ci` is Rust-only and
      # `dart analyze` does not compile fenced markdown, so this is the only
      # thing preventing prose from drifting from the real factories.
      - name: doc signatures match real factories
        run: python3 sdk/nostos_flutter/scripts/check-doc-signatures.py
      # The glue crate is a deliberate non-workspace member (ADR-0015
      # addendum), so the workspace-wide clippy/test jobs never see it —
      # gate its Rust here explicitly.
      - name: clippy + test (rust glue crate)
        working-directory: sdk/nostos_flutter/rust
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  benchmark:
    name: throughput benchmark (smoke)
    runs-on: ubuntu-latest
    # Benchmarks are expensive; only run a small smoke version on CI to keep
    # PRs honest. Full benchmark runs happen on a dedicated runner + locally.
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: smoke benchmark (1k clients, 10k events)
        run: |
          cargo run --release --bin nostos-bench -- \
            --clients 1000 --events 10000 --out-dir benches/results-smoke

  # TypeScript SDK typecheck gate (ADR-0015). The Rust workspace `make ci` never
  # sees the JS/TS SDKs, so a drift like the dotnet `nostos.cs` missing signOut or
  # RN-Android missing watchChanges can ship silently. This lean job runs the
  # pure-TS typecheck (tsc --noEmit) for the two SDKs whose gate needs no native
  # cdylib / device / browser. The native SDKs (swift/kotlin/dotnet) and web
  # (wasm-pack) need heavier toolchain setup and are a follow-up.
  sdk-typecheck:
    name: ${{ matrix.sdk }} — typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: nostos_react_native
            cmd: npm run typecheck
          - sdk: nostos_capacitor
            cmd: npm run build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        working-directory: sdk/${{ matrix.sdk }}
        run: npm ci
      - name: ${{ matrix.cmd }}
        working-directory: sdk/${{ matrix.sdk }}
        run: ${{ matrix.cmd }}
